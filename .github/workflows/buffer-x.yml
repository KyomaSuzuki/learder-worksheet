name: Daily X posts via Buffer
on:
  push:
    branches: [main]
    paths:
      - 'scripts/buffer_queue.py'
      - 'tests/test_buffer_queue.py'
      - '.github/workflows/buffer-x.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Reserve posts in Buffer (false = preview only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: buffer-x-queue
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test and validate drafts
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/buffer_queue.py --validate
      - name: Configure progress commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check connection and preview
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python3 scripts/buffer_queue.py
      - name: Reserve next seven mornings
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python3 scripts/buffer_queue.py --publish
